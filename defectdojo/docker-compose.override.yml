# DefectDojo Docker Compose Override for Windows / Hyper-V Environments
#
# On Windows hosts, Hyper-V and WSL2 frequently reserve TCP port ranges (8421-8520).
# This causes the default HTTPS port (8443) to fail with a host port binding error:
# "listen tcp 0.0.0.0:8443: bind: An attempt was made to access a socket in a way forbidden by its access permissions"
#
# This override file remaps the published TLS port to 9443 while preserving 8080 for HTTP.
#
# Usage with official DefectDojo compose:
#   docker compose -f <path-to-official-compose>/docker-compose.yml -f defectdojo/docker-compose.override.yml up -d

services:
  nginx:
    ports:
      - target: 8080
        published: ${DD_PORT:-8080}
        protocol: tcp
        mode: host
      - target: 8443
        published: ${DD_TLS_PORT:-9443}
        protocol: tcp
        mode: host
