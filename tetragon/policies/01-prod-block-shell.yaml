# 01-prod-block-shell.yaml
# Tetragon TracingPolicy: Block Interactive Shell Execution in Production Workloads
# Enforces runtime prevention by immediately terminating shell executions in the prod namespace.

apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: prod-block-shell
  labels:
    security.lab/environment: prod
    security.lab/tier: runtime-enforcement
spec:
  # Scope policy strictly to production workloads using Kubernetes metadata keys and pod labels
  podSelector:
    matchLabels:
      app: nginx
    matchExpressions:
      - key: "k8s:io.kubernetes.pod.namespace"
        operator: In
        values:
          - "prod"
  kprobes:
    # Hook the sys_execve system call entry point
    - call: "sys_execve"
      syscall: true
      args:
        - index: 0
          type: "string"
      selectors:
        # Match interactive and common scripting shell binaries
        - matchArgs:
            - index: 0
              operator: "Equal"
              values:
                - "/bin/sh"
                - "/bin/bash"
                - "/bin/ash"
                - "/bin/dash"
                - "/usr/bin/sh"
                - "/usr/bin/bash"
                - "/usr/bin/ash"
                - "/usr/bin/dash"
          matchActions:
            # Synchronously kill the violating process with SIGKILL before shell commands execute
            - action: Sigkill
